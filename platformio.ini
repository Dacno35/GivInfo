; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; creates the build environment. e.g. which board you're compiling for 
; qhich framework you are using, which compilter settings to use, which libraries to install
; how to tupload the firmware
; Standard espressif32 platform lacks Arduino 3.x + prebuilt IDF libs required by ESP32_Display_Panel.
; Match Espressif's official PlatformIO example: https://github.com/esp-arduino-libs/ESP32_Display_Panel
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip

; tells the project targets the Espressif ESP32 family
board = esp32-s3-devkitc-1
; the board definition. Tells platformIO information such as
; which processor is present, its speed, flash size, memory etc
; However this doesn't configure LCD 
framework = arduino

lib_deps =
    file://lib/ESP32_Display_Panel/esp-lib-utils
    lvgl/lvgl@8.4.0

monitor_speed = 115200
monitor_filters = direct
; Mac USB CDC port is usually /dev/cu.usbmodem*
upload_port = /dev/cu.usbmodem5B901710831
monitor_port = /dev/cu.usbmodem5B901710831
;ls /dev/cu.* to check which port is being used
; List ports: ls /dev/cu.*
upload_speed = 115200
; Forces the monitor to open this particular Mac serial port

board_build.flash_size = 8MB
; tells platformIO that the waveshare board has 8 MB of flash storage
board_build.arduino.memory_type = qio_opi
; Configures QIO flash and OPI PSRAM. The external PSRAM stores
; large display frame buffers
board_build.flash_mode = qio
; Makes the ESP32 communicate with its flash using four data lines for 
; greater speed

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
; Compiles code using C++17
    -DLV_CONF_INCLUDE_SIMPLE
; tells LVGL to search for its configuration using: 
; #include "lv_conf.h"
    -DLV_COLOR_16_SWAP=0
; Tells LVGL not to swap the two bytes of each RGB565 colour value.
; This affects whether 16-bit colours are displayed correctly
    -DBOARD_HAS_PSRAM
; Tells Arduino and the libraries that the board has external PSRAM. The display 
; uses PSRAM for large 800x480 frame bffers

    ;-DARDUINO_USB_CDC_ON_BOOT=1

;Enables native USB serial when the ESP32 starts. This makes Serial.println()
; available through the ESP32-S3's USB connector

    ;-DARDUINO_USB_MODE=1

; Selects the ESP32-S3 hardware USB CDC/JTAG mode used for native
; USB serial
    -I include
; Adds your project's include directory to the compiler's header search path
; allowing code such as #include "my_header.h" 
    -I lib/ESP32_Display_Panel/esp-lib-utils/src
; adds the local esp-lib-utils/src directory to the header search path.
; This allows the compiler to find: #include "esp_lib_utils.h"
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
; Tells ESP32_Display_Panel to use one of its built-in board configurations rather
; than requiring every LCD pin and timing to be configured manually
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7
; Selects the built-in configurations for your exact Waveshare 7-inch display. This
; supplies the correct information (LCD res, RGB pins, RGB timings, ST7262 display configurations 
;GT911 touch configuration and CH422G power and blacklight controls)
    -DCORE_DEBUG_LEVEL=3
;Enables informational logging from the ESP32 framework.
;-D means define a setting while -I means add an header 
